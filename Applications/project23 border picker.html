<!DOCTYPE html>
<html>
    <head>
        <title>Angular Border Picker</title>
        
        <meta charset = "UTF-8">
        <!--For mobile viewport proper resizing-->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!--Google verification -->
        <meta name="google-site-verification" content="onS_i1AOmpRlObgSmQ5S3Hc2vWXqpaGcGb6_Nc0w6-s" />
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="../../website_resources/global/images/favicon.ico">
        
        <!--Global resources-->
        <link rel="stylesheet" href="../../website_resources/global/css/global.css">
        <link rel="stylesheet" href="../../website_resources/global/css/video_page.css">
        <link rel="stylesheet" href="../../website_resources/global/css/catalogue_style.css">
        <script src="../../website_resources/global/scripts/video_page_script.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
        
        <!--Local resources-->
        <link rel="stylesheet" href="./resources/angular_app.css">
    </head>
    <body>
        <header id="page_header">
            <!--The content will be added from javascript-->
        </header>
        
        <div id="page_block">
            <div id="page_content">
                <div id="navigation">
                    <!-- Actual sidebar content -->
                    <div id="sidebar">

                    </div>
                </div>
                <div id = "block_content">
                    <div id="left_div" ng-app="angular_app" ng-controller = "angular_Controller"  style="height: auto;">
                        <h4> 
                            <p>Choose a border within the form below:</p>
                            <table style="width: 80%;">
                                <tr>
                                    <td>Type:</td>
                                    <td>Size:</td>
                                    <td>Color:</td>
                                </tr>
                                <tr>
                                    <td>
                                        <select ng-model="BdType" ng-change="OnChange()" style="width: 100%;">
                                            <option>dotted</option>
                                            <option>dashed</option>
                                            <option>solid</option>
                                            <option>double</option>
                                            <option>groove</option>
                                            <option>ridge</option>
                                            <option>inset</option>
                                            <option>none</option>
                                            <option>hidden</option>
                                        </select>
                                    </td>
                                    <td>
                                        <select ng-model="BdSize" ng-change="OnChange()" style="width: 100%;">
                                            <option>1px</option>
                                            <option>2px</option>
                                            <option>3px</option>
                                            <option>4px</option>
                                            <option>5px</option>
                                            <option>6px</option>
                                        </select></td>
                                    <td>
                                        <select ng-model="BdColor" ng-change="OnChange()" style="width: 100%;">
                                            <option>blue</option>
                                            <option>red</option>
                                            <option>pink</option>
                                            <option>green</option>
                                            <option>yellow</option>
                                            <option>orange</option>
                                            <option>purple</option>
                                        </select></td>
                                    </td>
                                </tr>
                            </table>
                            <br>Result:<br><br>
                            <p style="width:80%; height:5vw; padding:5%;" ng-style="{'border-color' : BdColor, 
                                                            'border-width' : BdSize, 'border-style' : BdType}" ng-bind="Border"></p>
                        </h4>
                    </div>
                </div>
            </div>
        </div>
        
        <footer id="page_footer">
            <!--The content will be added from javascript-->
        </footer> 
    </body>
    <!--This resource has to be added here because we need the elements in the HTML document to exist before 
    running the script-->
    
    <!--Global resources-->
    <script src="../../website_resources/global/scripts/global_script.js"></script>
    <script>
        var nested_app = angular.module('angular_app', []);
        nested_app.controller('angular_Controller', function($scope) {
            $scope.BdType="";
            $scope.BdSize="";
            $scope.BdColor="";
            $scope.Border="";
            $scope.OnChange = function()
            {
                $scope.Border = $scope.BdType + " " + $scope.BdSize + " " + $scope.BdColor;
            }
        });
        /*combining 2 angular apps into single one*/
        //angular.module("CombineModule", ["myApplication", "angular_app"]);
    </script>
</html>
